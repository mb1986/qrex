[package]
name = "qrex"
description = "Qt Resource Extractor"
version = "0.3.1"
authors = ["Michał Blinkiewicz <michal.blinkiewicz@gmail.com>"]
repository = "https://github.com/mb1986/qrex"
readme = "README.md"
license = "MIT"
keywords = ["qt", "resource", "extractor", "extraction"]
categories = ["data-structures", "command-line-utilities", "parsing"]
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.102"
binrw = "0.15.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_derive = "4.6.1"
env_logger = "0.11.10"
flate2 = { version = "1.1.9", features = ["zlib"], default-features = false }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
toml = "1.1.2"
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.2.1"
tempfile = "3.27.0"
